
name: Check Links

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
        args: >-
          --no-progress
          --max-retries 2
          --timeout 20
          --accept '100..=103,200..=299,403'
          "**/*.md"
          fail: true
